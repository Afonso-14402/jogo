<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07060a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Masmorra">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <title>Masmorra do Destino</title>
  <style>
    @font-face {
      font-family: 'Tiny5';
      src: url('fontes/Tiny5.woff2') format('woff2');
      font-display: swap;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #07060a;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      box-sizing: border-box;
      /* não deixa o jogo ficar debaixo do notch nem das bordas curvas */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: min(100vw, 150vh);
      height: min(66.667vw, 100vh);
      cursor: crosshair;
      image-rendering: pixelated;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <canvas id="tela"></canvas>
  <script src="js/dados.js"></script>
  <script src="js/idioma.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/biomas.js"></script>
  <script src="js/conteudo.js"></script>
  <script src="js/bossesFinais.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/cacador.js"></script>
  <script src="js/classes.js"></script>
  <script src="js/portais.js"></script>
  <script src="js/historia.js"></script>
  <script src="js/aventura.js"></script>
  <script src="js/polimento.js"></script>
  <script src="js/cenario.js"></script>
  <script src="js/guia.js"></script>
  <script src="js/coop.js"></script>
  <script src="js/modos.js"></script>
  <script src="js/cidade.js"></script>
  <script src="js/templo.js"></script>
  <script src="js/desenho.js"></script>
  <script src="js/ecras.js"></script>
  <script src="js/meta.js"></script>
  <script src="js/jogo.js"></script>
  <script src="js/musica.js"></script>
  <script src="js/toque.js"></script>
  <script>
    // Funciona sem internet depois de instalado (só em http/https, não em file://)
    // (na app Android o jogo já vem dentro da app: não precisa)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.Capacitor) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
