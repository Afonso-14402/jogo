# Constrói a app Android do jogo (para a Play Store).
# - Sempre: uma versão de teste (APK) para instalar diretamente num telemóvel.
# - Com a chave de assinatura nos segredos do repositório: o ficheiro .aab
#   assinado para enviar para a Play Store (e um APK assinado).
# Os ficheiros ficam em Actions → (esta execução) → Artifacts.
name: App Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'privacidade.html'
      - 'js/**'
      - 'fontes/**'
      - 'icones/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/copiar-www.js'
      - '.github/workflows/android.yml'

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor
        run: npm ci

      - name: Pôr o jogo dentro da app
        run: npm run android

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/chave.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/chave.p12" >> "$GITHUB_ENV"
            echo "Com chave: vai sair o .aab assinado para a Play Store"
          else
            echo "Sem chave nos segredos: só sai o APK de teste"
          fi

      - name: Construir
        working-directory: android
        env:
          VERSAO_CODIGO: ${{ github.run_number }}
          VERSAO_NOME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleDebug bundleRelease assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Guardar o APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: masmorra-apk-teste-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Guardar o .aab para a Play Store
        if: env.ANDROID_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: masmorra-play-store-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
